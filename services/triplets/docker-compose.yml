services:
  triplets:
    build:
      context: .
    restart: unless-stopped
    init: true
    environment:
      TRIPLETS_LLM_BASE_URL: ${TRIPLETS_LLM_BASE_URL:-http://llama:8080/v1}
      TRIPLETS_LLM_MODEL: ${TRIPLETS_LLM_MODEL:-NuExtract-2.0-2B-Q4_K_M.gguf}
      TRIPLETS_LLM_API_KEY: ${TRIPLETS_LLM_API_KEY:-}
      TRIPLETS_API_TOKEN: ${TRIPLETS_API_TOKEN:-}
      TRIPLETS_REQUEST_TIMEOUT_SECONDS: ${TRIPLETS_REQUEST_TIMEOUT_SECONDS:-180}
      TRIPLETS_HEALTH_TIMEOUT_SECONDS: ${TRIPLETS_HEALTH_TIMEOUT_SECONDS:-5}
      TRIPLETS_MAX_CONCURRENCY: ${TRIPLETS_MAX_CONCURRENCY:-2}
      TRIPLETS_MAX_QUEUE_WAIT_SECONDS: ${TRIPLETS_MAX_QUEUE_WAIT_SECONDS:-30}
      TRIPLETS_MAX_REQUEST_BYTES: ${TRIPLETS_MAX_REQUEST_BYTES:-196608}
      TRIPLETS_MAX_ENTITIES: ${TRIPLETS_MAX_ENTITIES:-64}
      TRIPLETS_MAX_FOCUS_ENTITIES: ${TRIPLETS_MAX_FOCUS_ENTITIES:-20}
      TRIPLETS_MAX_SENTENCES: ${TRIPLETS_MAX_SENTENCES:-250}
      TRIPLETS_MAX_INPUT_TOKENS: ${TRIPLETS_MAX_INPUT_TOKENS:-6000}
      TRIPLETS_MAX_EDGES: ${TRIPLETS_MAX_EDGES:-64}
      TRIPLETS_MAX_OUTPUT_TOKENS: ${TRIPLETS_MAX_OUTPUT_TOKENS:-2048}
      TRIPLETS_LLM_CONTEXT_SIZE: ${TRIPLETS_LLM_CONTEXT_SIZE:-24576}
      TRIPLETS_LLM_PARALLEL: ${TRIPLETS_LLM_PARALLEL:-2}
      TRIPLETS_RESPONSE_FORMAT: ${TRIPLETS_RESPONSE_FORMAT:-none}
      TRIPLETS_USE_NUEXTRACT_TEMPLATE: ${TRIPLETS_USE_NUEXTRACT_TEMPLATE:-true}
      TRIPLETS_REQUIRE_VERBATIM_PREDICATE: ${TRIPLETS_REQUIRE_VERBATIM_PREDICATE:-true}
    ports:
      - "${TRIPLETS_BIND_HOST:-127.0.0.1}:${TRIPLETS_PORT:-8091}:8091"
    mem_limit: ${TRIPLETS_ADAPTER_MEMORY_LIMIT:-512m}
    cpus: ${TRIPLETS_ADAPTER_CPUS:-1.0}
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  llama:
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    init: true
    command:
      - -hf
      - ${TRIPLETS_MODEL_SOURCE:-numind/NuExtract-2.0-2B-GGUF:Q4_K_M}
      - --no-mmproj
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - ${TRIPLETS_LLM_CONTEXT_SIZE:-24576}
      - --parallel
      - ${TRIPLETS_LLM_PARALLEL:-2}
      - --threads
      - ${TRIPLETS_LLM_THREADS:-8}
      - --threads-batch
      - ${TRIPLETS_LLM_THREADS_BATCH:-8}
      - --batch-size
      - ${TRIPLETS_LLM_BATCH_SIZE:-512}
      - --ubatch-size
      - ${TRIPLETS_LLM_UBATCH_SIZE:-128}
      - --cont-batching
      - --jinja
    volumes:
      - triplets-model-cache:/root/.cache/llama.cpp
    ports:
      - "127.0.0.1:${TRIPLETS_LLM_PORT:-8080}:8080"
    mem_limit: ${TRIPLETS_LLM_MEMORY_LIMIT:-4g}
    cpus: ${TRIPLETS_LLM_CPUS:-8.0}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  triplets-model-cache:
